<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-title" content="SR_PC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SR_PC_watchlist</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="shortcut icon" href="assets/icons/favicon.ico">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/main.css?v=0.6.10">
<link rel="stylesheet" href="css/portfolio-theme.css?v=0.2.0">
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <div class="app-brand">
      <span class="app-brand-mark">SR</span>
      <span class="app-brand-copy"><strong>SR_PC</strong><small>watchlist</small></span>
      <button class="mobile-nav-close" type="button" onclick="toggleMobileNav(false)" aria-label="關閉目錄">×</button>
    </div>
    <div class="app-search" aria-hidden="true"><span>⌕</span> 快速搜尋</div>
    <div class="app-nav-label">主要功能</div>
    <nav class="strategy-nav">
      <div class="page-inner" id="strategyNav"></div>
    </nav>
    <div class="app-system-card">
      <div><span>DATA SYSTEM</span><i></i></div>
      <strong id="appLastUpdated">載入中…</strong>
      <small id="appSyncStatus">等待資料載入</small>
    </div>
  </aside>
  <button class="mobile-nav-backdrop" type="button" onclick="toggleMobileNav(false)" aria-label="關閉目錄"></button>

  <section class="app-surface">
    <header>
      <div class="page-inner">
        <button class="mobile-menu-btn" type="button" onclick="toggleMobileNav(true)" aria-label="開啟目錄" aria-controls="strategyNav">☰</button>
        <div class="mobile-brand">SR_PC</div>
        <div class="page-heading">
          <strong id="pageHeadingTitle">投資決策中心</strong>
          <small>選股策略唯讀展示（不含績效與帳戶資料）</small>
        </div>
        <div class="header-quote" id="headerQuote">Aim for moon, you may hit a star.</div>
      </div>
    </header>

    <div id="loadProgress" class="load-progress" role="progressbar" aria-live="polite" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="load-progress-copy">
        <span id="loadProgressLabel">準備讀取資料…</span>
        <strong id="loadProgressPercent">0%</strong>
      </div>
      <div class="load-progress-track"><i id="loadProgressBar"></i></div>
    </div>

    <div class="page-layout">
      <main id="mainContent"></main>
      <aside class="watchlist-sidebar" id="rightSidebar" style="display:none">
        <div id="marketPanel" class="market-panel" style="display:none"></div>
      </aside>
    </div>
  </section>
</div>

<script src="js/public-stub.js"></script>
<script src="js/app.js?v=0.7.14"></script>
<script src="js/render-ssr.js?v=0.7.1"></script>
<script src="js/render-watchlist.js?v=0.1.6"></script>
<script src="js/render-candidates.js?v=0.1.1"></script>
<script src="js/render-neckline.js?v=0.2.1"></script>
<script src="js/render-neckline-track.js?v=0.1.0"></script>
<script src="js/render-chips.js?v=0.5.4"></script>
<script src="js/render-big-holder-trend.js?v=0.7.4"></script>
<script src="js/render-big-holder-trend-track.js?v=0.1.0"></script>
<script src="js/render-volume.js?v=0.5.1"></script>
<script src="js/render-volume-pullback.js?v=0.5.1"></script>
<script src="js/render-right-top.js?v=0.5.4"></script>
<script src="js/render-right-top-track.js?v=0.5.1"></script>
</body>
</html>
